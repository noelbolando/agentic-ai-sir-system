  <rect x="455" y="80" width="135" height="32" rx="7" fill="#276749"/>
  <text x="522" y="101" text-anchor="middle" font-size="13" font-weight="600" fill="white">Simulation</text>

  <rect x="455" y="119" width="135" height="36" rx="6" fill="white" stroke="#9AE6B4" stroke-width="1.5"/>
  <text x="522" y="141" text-anchor="middle" font-size="12" fill="#2D3748">Stochastic SIR</text>

  <rect x="455" y="162" width="135" height="36" rx="6" fill="white" stroke="#9AE6B4" stroke-width="1.5"/>
  <text x="522" y="184" text-anchor="middle" font-size="12" fill="#2D3748">Agent-Based Model</text>

  <rect x="455" y="205" width="135" height="36" rx="6" fill="white" stroke="#9AE6B4" stroke-width="1.5"/>
  <text x="522" y="227" text-anchor="middle" font-size="12" fill="#2D3748">Monte Carlo Runs</text>

  <rect x="455" y="248" width="135" height="36" rx="6" fill="white" stroke="#9AE6B4" stroke-width="1.5"/>
  <text x="522" y="270" text-anchor="middle" font-size="12" fill="#2D3748">Python (pure)</text>

  <!-- ── Column 5: Data & Analysis ── -->
  <rect x="600" y="80" width="135" height="32" rx="7" fill="#2B6CB0"/>
  <text x="667" y="101" text-anchor="middle" font-size="13" font-weight="600" fill="white">Data &amp; Analysis</text>

  <rect x="600" y="119" width="135" height="36" rx="6" fill="white" stroke="#BEE3F8" stroke-width="1.5"/>
  <text x="667" y="141" text-anchor="middle" font-size="12" fill="#2D3748">Pandas</text>

  <rect x="600" y="162" width="135" height="36" rx="6" fill="white" stroke="#BEE3F8" stroke-width="1.5"/>
  <text x="667" y="184" text-anchor="middle" font-size="12" fill="#2D3748">NumPy</text>

  <rect x="600" y="205" width="135" height="36" rx="6" fill="white" stroke="#BEE3F8" stroke-width="1.5"/>
  <text x="667" y="227" text-anchor="middle" font-size="12" fill="#2D3748">Matplotlib</text>

  <!-- ── Column 6: Knowledge / RAG ── -->
  <rect x="745" y="80" width="135" height="32" rx="7" fill="#553C9A"/>
  <text x="812" y="101" text-anchor="middle" font-size="13" font-weight="600" fill="white">Knowledge / RAG</text>

  <rect x="745" y="119" width="135" height="36" rx="6" fill="white" stroke="#D6BCFA" stroke-width="1.5"/>
  <text x="812" y="141" text-anchor="middle" font-size="12" fill="#2D3748">Markdown KB</text>

  <rect x="745" y="162" width="135" height="36" rx="6" fill="white" stroke="#D6BCFA" stroke-width="1.5"/>
  <text x="812" y="184" text-anchor="middle" font-size="12" fill="#2D3748">Keyword Retrieval</text>

  <rect x="745" y="205" width="135" height="36" rx="6" fill="white" stroke="#D6BCFA" stroke-width="1.5"/>
  <text x="812" y="227" text-anchor="middle" font-size="12" fill="#2D3748">SIR Model Docs</text>

  <!-- ── Footer ── -->
  <line x1="20" y1="430" x2="880" y2="430" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Architecture flow -->
  <text x="450" y="456" text-anchor="middle" font-size="12" fill="#718096">
    User → Streamlit UI → Agent Layer (LangGraph) → SIR Simulation / Groq LLM / Knowledge Base → Results
  </text>

  <!-- Badges -->
  <rect x="20"  y="470" width="90"  height="26" rx="6" fill="#EDF2F7"/>
  <text x="65"  y="487" text-anchor="middle" font-size="11" font-weight="500" fill="#4A5568">Python 3.9+</text>

  <rect x="118" y="470" width="56"  height="26" rx="6" fill="#EDF2F7"/>
  <text x="146" y="487" text-anchor="middle" font-size="11" font-weight="500" fill="#4A5568">GitHub</text>

  <rect x="182" y="470" width="148" height="26" rx="6" fill="#EDF2F7"/>
  <text x="256" y="487" text-anchor="middle" font-size="11" font-weight="500" fill="#4A5568">Streamlit Community Cloud</text>

  <rect x="338" y="470" width="80"  height="26" rx="6" fill="#EDF2F7"/>
  <text x="378" y="487" text-anchor="middle" font-size="11" font-weight="500" fill="#4A5568">Groq (Free)</text>

  <rect x="426" y="470" width="98"  height="26" rx="6" fill="#EDF2F7"/>
  <text x="475" y="487" text-anchor="middle" font-size="11" font-weight="500" fill="#4A5568">MIT License</text>

</svg>
