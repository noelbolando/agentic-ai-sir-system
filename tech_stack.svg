<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520"
     font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">

  <!-- Background -->
  <rect width="900" height="520" fill="#F7FAFC" rx="14"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#1A202C">SIR Disease Simulator — Tech Stack</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#718096">Multi-Agent AI Epidemic Modeling System</text>

  <!-- ── Column 1: Frontend ── -->
  <rect x="20"  y="80" width="135" height="32" rx="7" fill="#E53E3E"/>
  <text x="87"  y="101" text-anchor="middle" font-size="13" font-weight="600" fill="white">Frontend</text>

  <rect x="20"  y="119" width="135" height="36" rx="6" fill="white" stroke="#FEB2B2" stroke-width="1.5"/>
  <text x="87"  y="141" text-anchor="middle" font-size="12" fill="#2D3748">Streamlit</text>

  <rect x="20"  y="162" width="135" height="36" rx="6" fill="white" stroke="#FEB2B2" stroke-width="1.5"/>
  <text x="87"  y="184" text-anchor="middle" font-size="12" fill="#2D3748">Streamlit Cloud</text>

  <rect x="20"  y="205" width="135" height="36" rx="6" fill="white" stroke="#FEB2B2" stroke-width="1.5"/>
  <text x="87"  y="227" text-anchor="middle" font-size="12" fill="#2D3748">GitHub</text>

  <!-- ── Column 2: Agents ── -->
  <rect x="165" y="80" width="135" height="32" rx="7" fill="#4C51BF"/>
  <text x="232" y="101" text-anchor="middle" font-size="13" font-weight="600" fill="white">Agents</text>

  <rect x="165" y="119" width="135" height="36" rx="6" fill="white" stroke="#C3DAFE" stroke-width="1.5"/>
  <text x="232" y="141" text-anchor="middle" font-size="12" fill="#2D3748">UI Agent</text>

  <rect x="165" y="162" width="135" height="36" rx="6" fill="white" stroke="#C3DAFE" stroke-width="1.5"/>
  <text x="232" y="184" text-anchor="middle" font-size="12" fill="#2D3748">Model Agent</text>

  <rect x="165" y="205" width="135" height="36" rx="6" fill="white" stroke="#C3DAFE" stroke-width="1.5"/>
  <text x="232" y="227" text-anchor="middle" font-size="12" fill="#2D3748">Analyzer Agent</text>

  <rect x="165" y="248" width="135" height="36" rx="6" fill="white" stroke="#C3DAFE" stroke-width="1.5"/>
  <text x="232" y="270" text-anchor="middle" font-size="12" fill="#2D3748">Reporter Agent</text>

  <rect x="165" y="291" width="135" height="36" rx="6" fill="white" stroke="#C3DAFE" stroke-width="1.5"/>
  <text x="232" y="313" text-anchor="middle" font-size="12" fill="#2D3748">RAG Agent</text>

  <rect x="165" y="334" width="135" height="36" rx="6" fill="white" stroke="#C3DAFE" stroke-width="1.5"/>
  <text x="232" y="356" text-anchor="middle" font-size="12" fill="#2D3748">LangGraph</text>

  <!-- ── Column 3: LLM ── -->
  <rect x="310" y="80" width="135" height="32" rx="7" fill="#C05621"/>
  <text x="377" y="101" text-anchor="middle" font-size="13" font-weight="600" fill="white">LLM</text>

  <rect x="310" y="119" width="135" height="36" rx="6" fill="white" stroke="#FEEBC8" stroke-width="1.5"/>
  <text x="377" y="141" text-anchor="middle" font-size="12" fill="#2D3748">Groq API</text>

  <rect x="310" y="162" width="135" height="36" rx="6" fill="white" stroke="#FEEBC8" stroke-width="1.5"/>
  <text x="377" y="184" text-anchor="middle" font-size="12" fill="#2D3748">LLaMA 3.3 70B</text>

  <rect x="310" y="205" width="135" height="36" rx="6" fill="white" stroke="#FEEBC8" stroke-width="1.5"/>
  <text x="377" y="227" text-anchor="middle" font-size="12" fill="#2D3748">LLaMA 3 8B</text>

  <rect x="310" y="248" width="135" height="36" rx="6" fill="white" stroke="#FEEBC8" stroke-width="1.5"/>
  <text x="377" y="270" text-anchor="middle" font-size="12" fill="#2D3748">Mixtral 8x7B</text>

